server {
    # იმავე პორტზე, რომელზეც აქამდე dev server იყო —
    # სერვერზე docker-compose/proxy კონფიგურაცია უცვლელი რჩება.
    #
    # IPv6-ზეც აუცილებლად უნდა ვუსმინოთ: healthcheck და proxy `localhost`-ს
    # ხშირად ჯერ ::1-ად შიფრავს. nginx-ის image ამას ავტომატურად ამატებს
    # მხოლოდ საკუთარ ნაგულისხმევ კონფიგში, ჩვენსას კი ვერ შეეხება.
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # ნაგულისხმევი დონე 1-ია და სუსტად კუმშავს; 6 საგრძნობლად უკეთესია
    # და პროცესორზე დატვირთვა სტატიკურ ფაილებზე მაინც უმნიშვნელოა.
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # hash-იანი ფაილები (index-0368b72a.js). შიგთავსის ცვლილებისას სახელი
    # იცვლება, ამიტომ უსაფრთხოდ იქეშება ერთი წლით.
    # ^~ იმისთვის, რომ ქვემოთ მოცემულმა regex-მა არ გადაფაროს.
    # მხოლოდ add_header გამოიყენება და არა expires — თორემ ორივე თავის
    # Cache-Control-ს ამატებს და პასუხში დუბლირებული სათაური ჩნდება.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ფონტები, სურათები, აუდიო — სახელში hash არ აქვთ, ამიტომ უფრო მოკლე ვადით.
    location ~* \.(woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|m4a|mp3)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # index.html არასდროს არ უნდა დაიქეშოს — სწორედ ის უთითებს,
    # რომელი hash-იანი ფაილები ჩამოიტვირთოს. თუ ის დაიქეშა,
    # მომხმარებელი ძველ ვერსიაზე გაიჭედება.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: /lexicon-search-ის მსგავს მისამართებს ფაილი არ შეესაბამება,
    # ამიტომ index.html უნდა დაბრუნდეს და routing-ს React აიღებს.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
